<!doctype html><html lang="ko"><meta charset="utf-8"><title>채팅 도구 · 가상 데이터 검증</title>
<link rel="stylesheet" href="/chat-design.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#262626;font:13px/1.5 'Malgun Gothic',sans-serif}.controls{padding:10px;display:flex;gap:8px;flex-wrap:wrap}.controls button{padding:6px}.window{width:min(359px,100vw);height:calc(100vh - 72px);max-height:900px;margin:0 auto;background:#fff;border:1px solid #d5d5d5;display:flex;flex-direction:column;overflow:hidden}header{flex:none;background:white}header>div:first-child{height:52px;padding:8px;display:flex;align-items:center;justify-content:space-between}a{color:inherit;text-decoration:none}header button{border:0;background:white;padding:8px}.flex-row-reverse{flex-direction:row-reverse}#chatBody{flex:1;min-height:0;overflow:auto}.rows{padding:0 12px}.message-row{margin:14px 0}.line{display:flex;align-items:flex-end;gap:4px}[data-sentry-component=MessageContents]{max-width:270px}.date{font-size:11px;color:#777}blockquote{margin:0 0 4px}form{padding:10px;border-top:1px solid #ddd}textarea{width:100%;height:54px;resize:none;border:1px solid #ccc;border-radius:4px;padding:8px}#state{font-size:11px}#sentinel{height:4px}
</style><div class="controls"><button id="reset">기본 데이터</button><button id="empty">내 메시지 없음</button><button id="stall">이전 로딩 멈춤</button><button id="rebuild">헤더 재생성</button><button id="deleted">내 메시지 삭제 반영</button><button id="external">외부 방 전환</button><button id="broken">구조 변경</button><button id="narrow">좁은 창 300px</button><span id="state"></span></div>
<section class="window"><header data-sentry-component="ChatHeader"><div><button aria-label="내채팅 뒤로가기">‹</button><a href="/companies/1">가온테크</a><div><button aria-label="채팅 검색">검색</button><button aria-label="공유">공유</button></div></div></header><div id="chatBody" class="chatBody-10"><div id="sentinel"></div><div class="rows"></div></div><form><label for="draft">내 메시지 작성</label><textarea id="draft" placeholder="전송하지 않는 가상 입력란"></textarea></form></section>
<script src="/fixture.js"></script><script src="/chat-tools-main.js"></script><script src="/chat-tools.js"></script><script src="/chat-react-main.js"></script><script src="/chat-reply.js"></script></html>
